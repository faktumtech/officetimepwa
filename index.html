<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>OfficeTimePwa</title>
    <meta
      name="description"
      content="Time tracking tool for freelancers. Heavely inspired by OfficeTime. Designed as Progressive Web App (PWA) that works offline and stores all data exclusivly in the local browser."
    />
    <link href="/css/roboto.css" rel="preload" as="style" />
    <!-- avoid render blocking -->
    <link rel="stylesheet" href="/css/roboto.css" media="print" onload="this.media='all'" />
  </head>
  <body>
    <noscript>
      <strong>
        We're sorry but OfficeTimePwa doesn't work properly without JavaScript enabled. Please enable it to
        continue.
      </strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
